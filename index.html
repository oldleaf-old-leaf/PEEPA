<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEEPA | WeChat Briefing</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #151a21;
            --accent-green: #00ffa3;
            --text-main: #ffffff;
            --text-muted: #848e9c;
            --btn-hover: #00e692;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .dashboard {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            margin: 20px 0;
        }
        .lang-bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 15px; }
        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .lang-btn.active {
            background-color: var(--accent-green);
            color: #0b0e11;
            border-color: var(--accent-green);
        }
        .token-logo-outer {
            width: 110px; height: 110px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), #00bcff);
            margin: 0 auto 20px auto;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(0, 255, 163, 0.3);
        }
        .token-logo {
            width: 100px; height: 100px; border-radius: 50%;
            object-fit: cover; display: block; background: #1a222d;
        }
        h1 { font-size: 2.2rem; margin: 0 0 8px; letter-spacing: -0.5px; }
        .badge {
            background: rgba(0, 255, 163, 0.1);
            color: var(--accent-green);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 163, 0.15);
        }
        .about-text, .risk-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.65;
            margin-bottom: 16px;
            text-align: left;
            background: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 12px;
        }
        .risk-text { font-size: 0.85rem; }
        .tokenomics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .tokenomics-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .stat-value { font-size: 0.95rem; font-weight: bold; }

        .block {
            text-align: left;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .block-title {
            color: var(--accent-green);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .row input {
            flex: 1;
            min-width: 0;
            background: var(--bg-color);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: var(--text-main);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.7rem;
            padding: 10px;
            outline: none;
        }
        .open-btn, .copy-btn {
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.78rem;
            text-decoration: none;
            white-space: nowrap;
            padding: 10px 12px;
        }
        .open-btn {
            background: rgba(0, 255, 163, 0.12);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 163, 0.25);
        }
        .copy-btn {
            background: var(--accent-green);
            color: #0b0e11;
            border: none;
        }
        .hint { color: var(--text-muted); font-size: 0.78rem; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="lang-bar">
            <button type="button" class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
            <button type="button" class="lang-btn" id="btn-zh" onclick="setLanguage('zh')">中文</button>
        </div>

        <div class="token-logo-outer">
            <img class="token-logo" src="circlepng.png" alt="PEEPA">
        </div>
        <h1>PEEPA</h1>
        <div class="badge" id="network-badge">SOLANA NETWORK</div>
        <div class="about-text" id="about-content"></div>

        <div class="tokenomics-grid">
            <div class="tokenomics-item">
                <div class="stat-label" id="lbl-type"></div>
                <div class="stat-value" id="val-type"></div>
            </div>
            <div class="tokenomics-item">
                <div class="stat-label" id="lbl-supply"></div>
                <div class="stat-value">~1B</div>
            </div>
            <div class="tokenomics-item">
                <div class="stat-label" id="lbl-venue"></div>
                <div class="stat-value" id="val-venue"></div>
            </div>
            <div class="tokenomics-item">
                <div class="stat-label" id="lbl-holders"></div>
                <div class="stat-value">~1.2k–1.4k</div>
            </div>
        </div>
        <div class="about-text" id="checklist-content"></div>

        <!-- 1. CA -->
        <section class="block">
            <div class="block-title" id="sec-ca-title">1. CA</div>
            <p class="hint" id="sec-ca-hint"></p>
            <div class="row">
                <input id="ca-input" type="text" value="EamB9vqC1b4aoyPR6t3hn6CWf48yny84xzCuFJMbpump" readonly>
                <button type="button" class="copy-btn" id="copy-ca" onclick="copyFrom('ca-input')">Copy</button>
            </div>
        </section>

        <!-- 2. Platforms -->
        <section class="block">
            <div class="block-title" id="sec-plat-title">2. Platforms</div>
            <p class="hint" id="sec-plat-hint"></p>
            <div class="row">
                <input id="link-gecko" type="text" readonly>
                <a class="open-btn" id="open-gecko" href="#" target="_blank" rel="noopener">Open</a>
                <button type="button" class="copy-btn" id="copy-gecko" onclick="copyFrom('link-gecko')">Copy</button>
            </div>
            <div class="row">
                <input id="link-solscan" type="text" readonly>
                <a class="open-btn" id="open-solscan" href="#" target="_blank" rel="noopener">Open</a>
                <button type="button" class="copy-btn" id="copy-solscan" onclick="copyFrom('link-solscan')">Copy</button>
            </div>
            <div class="row">
                <input id="link-pump" type="text" readonly>
                <a class="open-btn" id="open-pump" href="#" target="_blank" rel="noopener">Open</a>
                <button type="button" class="copy-btn" id="copy-pump" onclick="copyFrom('link-pump')">Copy</button>
            </div>
        </section>

        <!-- 3. Community -->
        <section class="block">
            <div class="block-title" id="sec-com-title">3. Community</div>
            <p class="hint" id="sec-com-hint"></p>
            <div class="row">
                <input id="link-x" type="text" readonly>
                <a class="open-btn" id="open-x" href="#" target="_blank" rel="noopener">Open</a>
                <button type="button" class="copy-btn" id="copy-x" onclick="copyFrom('link-x')">Copy</button>
            </div>
            <div class="row">
                <input id="link-tg" type="text" readonly>
                <a class="open-btn" id="open-tg" href="#" target="_blank" rel="noopener">Open</a>
                <button type="button" class="copy-btn" id="copy-tg" onclick="copyFrom('link-tg')">Copy</button>
            </div>
        </section>

        <div class="risk-text" id="risk-content" style="margin-top: 18px;"></div>
    </div>

    <script>
        const CA = "EamB9vqC1b4aoyPR6t3hn6CWf48yny84xzCuFJMbpump";
        const LINKS = {
            gecko: "https://www.geckoterminal.com/solana/pools/BoB3Dvi5eLGFr86BexBPNY2ZXwMNjWhx3FVCep3X2Vj6",
            solscan: "https://solscan.io/token/" + CA,
            pump: "https://pump.fun/coin/" + CA,
            x: "https://x.com/i/communities/2021710777552674973",
            tg: "https://t.me/ThePeepacommunity"
        };

        const translations = {
            en: {
                network: "SOLANA NETWORK",
                about: "<strong>$PEEPA — briefing (for educational purposes only, not financial advice — NFA)</strong><br><br>Name: Peepa (The wife of Pepe The Frog)<br>Chain: Solana<br><br>“The Wife of Pepe the Frog” comes from long-standing digital artwork on Reddit (r/memes) by independent artist @MrGarrisonFjord. The character existed for almost a decade before it was tokenized on-chain as $PEEPA. The community’s stated model is not only to use the image, but to route Pump.fun creator fees to the original artist. Please verify that on-chain.,
                lblType: "Type", valType: "Pump.fun graduate",
                lblSupply: "Supply", lblVenue: "Main venue", valVenue: "PumpSwap", lblHolders: "Holders",
                checklist: "<strong>Public checklist</strong> (numbers change — check explorers):<br>• ~1B supply<br>• Graduated from Pump.fun; trades mainly on PumpSwap<br>• Pages report mint/freeze disabled and LP burned/locked — re-check<br>• Small cap / thin liquidity — high risk<br><br>If a link fails inside WeChat, use Copy and paste into Safari / Chrome.",
                secCa: "1. Contract address (CA)",
                secCaHint: "Verify this exact mint on Solscan. If you share it, copy and paste the address as text in WeChat (links often fail there).",
                secPlat: "2. Platforms",
                secPlatHint: "Chart and explorers. Open if it works; otherwise Copy.",
                secCom: "3. Community",
                secComHint: "X often needs a VPN in mainland China. Telegram may also be blocked.",
                open: "Open", copy: "Copy",
                risk: "<strong>Risks</strong><br>1. Many clone tickers exist (including $PEEPA on other blockchains). Use only this contract.<br>2. Small-cap meme coins can go to zero. This is not financial advice.<br>3. DYOR. Random WeChat “admins” are not official.",
                copied: "Copied.",
                copyFail: "Copy failed. Long-press the text to copy."
            },
            zh: {
                network: "SOLANA 网络",
                about: "<strong>【项目简介 | $PEEPA】（仅供教育了解，不构成理财或投资建议 — NFA）</strong><br><br>名称：Peepa（The wife of Pepe The Frog）<br>类型：Solana 模因代币（Pump.fun 毕业盘）<br>网络：Solana<br><br>“The Wife of Pepe the Frog”（佩佩的妻子）源自独立艺术家 @MrGarrisonFjord 多年前在 Reddit（r/memes）发布的数字作品。角色已存在近十年，之后才被铸造为链上代币 $PEEPA。社区公开说法是：不只沿用形象，还将 Pump.fun 创作者分成给原作者。请自行在链上核实。,
                lblType: "类型", valType: "Pump.fun 毕业盘",
                lblSupply: "供应", lblVenue: "主要交易", valVenue: "PumpSwap", lblHolders: "持有人",
                checklist: "<strong>公开可查信息</strong>（会变动，以链上为准）：<br>• 供应约 10 亿枚<br>• 已从 Pump.fun 毕业，主要在 PumpSwap 交易<br>• 页面显示 Mint / Freeze 已关闭，LP 已销毁或锁定（请复核）<br>• 市值与流动性为小市值级别，波动极大<br><br>微信打不开链接时，点「复制」再粘贴到系统浏览器。",
                secCa: "1. 合约地址（CA）",
                secCaHint: "请到 Solscan 核对这一条合约。发给朋友时，请复制地址并以纯文本发到微信（微信里外链经常打不开）。",
                secPlat: "2. 平台链接",
                secPlatHint: "行情与浏览器。能打开就点打开，不能就复制。",
                secCom: "3. 社群",
                secComHint: "国内打开 X 通常需要 VPN。Telegram 也可能被拦截。",
                open: "打开", copy: "复制",
                risk: "<strong>风险提示</strong><br>1. 同名代币很多（包括其他链上的 $PEEPA），只认上述合约。<br>2. 小市值模因币可归零，流动性浅，不是投资建议。<br>3. 请自行研究（DYOR）。微信里自称管理员的账号不代表官方。",
                copied: "已复制。",
                copyFail: "复制失败，请长按文本手动复制。"
            }
        };

        let currentLang = "en";

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
            document.getElementById("btn-en").classList.toggle("active", lang === "en");
            document.getElementById("btn-zh").classList.toggle("active", lang === "zh");
            document.getElementById("network-badge").textContent = t.network;
            document.getElementById("about-content").innerHTML = t.about;
            document.getElementById("lbl-type").textContent = t.lblType;
            document.getElementById("val-type").textContent = t.valType;
            document.getElementById("lbl-supply").textContent = t.lblSupply;
            document.getElementById("lbl-venue").textContent = t.lblVenue;
            document.getElementById("val-venue").textContent = t.valVenue;
            document.getElementById("lbl-holders").textContent = t.lblHolders;
            document.getElementById("checklist-content").innerHTML = t.checklist;
            document.getElementById("sec-ca-title").textContent = t.secCa;
            document.getElementById("sec-ca-hint").textContent = t.secCaHint;
            document.getElementById("sec-plat-title").textContent = t.secPlat;
            document.getElementById("sec-plat-hint").textContent = t.secPlatHint;
            document.getElementById("sec-com-title").textContent = t.secCom;
            document.getElementById("sec-com-hint").textContent = t.secComHint;
            document.getElementById("risk-content").innerHTML = t.risk;

            ["copy-ca", "copy-gecko", "copy-solscan", "copy-pump", "copy-x", "copy-tg"].forEach(function (id) {
                document.getElementById(id).textContent = t.copy;
            });
            ["open-gecko", "open-solscan", "open-pump", "open-x", "open-tg"].forEach(function (id) {
                document.getElementById(id).textContent = t.open;
            });
        }

        function fillLinks() {
            document.getElementById("ca-input").value = CA;
            document.getElementById("link-gecko").value = LINKS.gecko;
            document.getElementById("link-solscan").value = LINKS.solscan;
            document.getElementById("link-pump").value = LINKS.pump;
            document.getElementById("link-x").value = LINKS.x;
            document.getElementById("link-tg").value = LINKS.tg;
            document.getElementById("open-gecko").href = LINKS.gecko;
            document.getElementById("open-solscan").href = LINKS.solscan;
            document.getElementById("open-pump").href = LINKS.pump;
            document.getElementById("open-x").href = LINKS.x;
            document.getElementById("open-tg").href = LINKS.tg;
        }

        function copyFrom(id) {
            const el = document.getElementById(id);
            el.focus();
            el.select();
            const value = el.value;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(value).then(function () {
                    alert(translations[currentLang].copied);
                }).catch(function () {
                    alert(document.execCommand("copy") ? translations[currentLang].copied : translations[currentLang].copyFail);
                });
            } else {
                alert(document.execCommand("copy") ? translations[currentLang].copied : translations[currentLang].copyFail);
            }
        }

        fillLinks();
        setLanguage("en");
    </script>
</body>
</html>
