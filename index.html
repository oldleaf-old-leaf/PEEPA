<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEEPA | Token Briefing</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #151a21;
            --accent-green: #00ffa3;
            --text-main: #ffffff;
            --text-muted: #848e9c;
            --btn-hover: #00e692;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            margin: 20px 0;
        }

        .lang-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 15px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .lang-btn.active {
            background-color: var(--accent-green);
            color: #0b0e11;
            border-color: var(--accent-green);
        }

        .token-logo-outer {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), #00bcff);
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 255, 163, 0.3);
        }

        .token-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background-color: #1a222d;
        }

        h1 { font-size: 2.2rem; margin: 0 0 8px 0; letter-spacing: -0.5px; }

        .badge {
            background-color: rgba(0, 255, 163, 0.1);
            color: var(--accent-green);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 163, 0.15);
        }

        .about-text, .risk-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.65;
            margin-bottom: 16px;
            text-align: left;
            background: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .risk-text { font-size: 0.85rem; }

        .tokenomics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .tokenomics-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .link-stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

        .action-btn {
            display: block;
            background-color: var(--accent-green);
            color: #0b0e11;
            text-decoration: none;
            font-weight: bold;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .action-btn.secondary {
            background: rgba(0, 255, 163, 0.12);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 163, 0.25);
        }

        .action-btn:hover { background-color: var(--btn-hover); color: #0b0e11; }

        .contract-box {
            display: flex;
            background-color: var(--bg-color);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            overflow: hidden;
            padding: 4px;
            margin-top: 5px;
        }

        .contract-box input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-main);
            font-family: ui-monospace, monospace;
            font-size: 0.72rem;
            padding: 10px;
            outline: none;
            min-width: 0;
        }

        .copy-btn {
            background-color: rgba(0, 255, 163, 0.1);
            border: 1px solid rgba(0, 255, 163, 0.2);
            color: var(--accent-green);
            cursor: pointer;
            font-weight: bold;
            padding: 0 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .contract-label {
            text-align: left;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="lang-bar">
            <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" id="btn-zh" onclick="setLanguage('zh')">中文</button>
        </div>
        
        <div class="token-logo-outer">
            <img class="token-logo" src="circlepng.png" alt="PEEPA">
        </div>
        
        <h1>PEEPA</h1>
        <div class="badge" id="network-badge">SOLANA NETWORK</div>
        <div class="about-text" id="about-content"></div>

        <div class="tokenomics-grid">
            <div class="tokenomics-item">
                <div class="stat-label" id="lbl-type"></div>
                <div class="stat-value" id="val-type"></div>
            </div>
            <div class="tokenomics-item">
                <div class="stat-label" id="lbl-supply"></div>
                <div class="stat-value">~1B</div>
            </div>
            <div class="tokenomics-item">
                <div class="stat-label" id="lbl-venue"></div>
                <div class="stat-value" id="val-venue"></div>
            </div>
            <div class="tokenomics-item">
                <div class="stat-label" id="lbl-holders"></div>
                <div class="stat-value">~1.2k–1.4k</div>
            </div>
        </div>

        <div class="about-text" id="checklist-content"></div>

        <div class="link-stack">
            <a class="action-btn" id="btn-gecko" href="https://www.geckoterminal.com/solana/pools/BoB3Dvi5eLGFr86BexBPNY2ZXwMNjWhx3FVCep3X2Vj6" target="_blank" rel="noopener">GeckoTerminal</a>
            <a class="action-btn secondary" id="btn-solscan" href="https://solscan.io/token/EamB9vqC1b4aoyPR6t3hn6CWf48yny84xzCuFJMbpump" target="_blank" rel="noopener">Solscan</a>
            <a class="action-btn secondary" id="btn-pump" href="https://pump.fun/coin/EamB9vqC1b4aoyPR6t3hn6CWf48yny84xzCuFJMbpump" target="_blank" rel="noopener">Pump.fun</a>
        </div>

        <div class="contract-section">
            <div class="contract-label" id="lbl-ca"></div>
            <div class="contract-box">
                <input type="text" id="ca-input" value="EamB9vqC1b4aoyPR6t3hn6CWf48yny84xzCuFJMbpump" readonly>
                <button class="copy-btn" id="copy-btn-text" onclick="copyTokenAddress()">Copy</button>
            </div>
        </div>

        <div class="risk-text" id="risk-content" style="margin-top: 18px;"></div>
    </div>

    <script>
        const translations = {
            en: {
                network: "SOLANA NETWORK",
                about: "<strong>$PEEPA — briefing (not a recommendation)</strong><br><br>Name: Peepa (The wife of Pepe The Frog)<br>Chain: Solana<br><br>Public pages describe it as a meme based on a ~2017–2018 Reddit “Pepe’s wife” image by GarrisonFjord, with creator fees said to go to that artist. Confirm on-chain yourself.",
                lblType: "Type",
                valType: "Pump.fun graduate",
                lblSupply: "Supply",
                lblVenue: "Main venue",
                valVenue: "PumpSwap",
                lblHolders: "Holders",
                checklist: "<strong>Public checklist</strong> (numbers change — check explorers):<br>• ~1B supply<br>• Graduated from Pump.fun; trades mainly on PumpSwap<br>• Pages report mint/freeze disabled and LP burned/locked — re-check<br>• Small cap / thin liquidity — high risk<br><br>If a link fails inside WeChat, copy it and open in Safari / Chrome.",
                btnGecko: "View chart on GeckoTerminal",
                btnSolscan: "Open Solscan",
                btnPump: "Open Pump.fun",
                lblCa: "Token mint address (CA) — verify this exact address:",
                btnCopy: "Copy",
                risk: "<strong>Risks</strong><br>1. Many clone tickers exist (including an Ethereum $PEEPA). Use only this contract.<br>2. Small-cap meme coins can go to zero. This is not financial advice.<br>3. DYOR.",
                msgSuccess: "Contract address copied.",
                msgFail: "Copy failed. Long-press the address to copy."
            },
            zh: {
                network: "SOLANA 网络",
                about: "<strong>【项目简介 | $PEEPA】</strong><br><br>名称：Peepa（The wife of Pepe The Frog）<br>类型：Solana 模因代币（Pump.fun 毕业盘）<br>网络：Solana<br><br>社区叙事来自约 2017–2018 年 Reddit 上 “Pepe 的妻子” 模因（作者 GarrisonFjord）。项目方宣传交易手续费流向原作者。以上为公开页面说法，请自行验证。",
                lblType: "类型",
                valType: "Pump.fun 毕业盘",
                lblSupply: "供应",
                lblVenue: "主要交易",
                valVenue: "PumpSwap",
                lblHolders: "持有人",
                checklist: "<strong>公开可查信息</strong>（会变动，以链上为准）：<br>• 供应约 10 亿枚<br>• 已从 Pump.fun 毕业，主要在 PumpSwap 交易<br>• 页面显示 Mint / Freeze 已关闭，LP 已销毁或锁定（请复核）<br>• 市值与流动性为小市值级别，波动极大<br><br>微信内链接可能打不开，请长按复制后用系统浏览器打开。",
                btnGecko: "在 GeckoTerminal 查看行情",
                btnSolscan: "打开 Solscan",
                btnPump: "打开 Pump.fun",
                lblCa: "智能合约地址（请自行核对，谨防假盘）：",
                btnCopy: "复制",
                risk: "<strong>风险提示</strong><br>1. 同名代币很多（包括以太坊上的 $PEEPA），只认上述合约。<br>2. 小市值模因币可归零，流动性浅，不是投资建议。<br>3. 请自行研究（DYOR）。不构成投资、理财或购买建议。",
                msgSuccess: "合约地址已复制。",
                msgFail: "复制失败，请长按地址框手动复制。"
            }
        };

        let currentLang = "en";

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
            document.getElementById("btn-en").classList.toggle("active", lang === "en");
            document.getElementById("btn-zh").classList.toggle("active", lang === "zh");
            document.getElementById("network-badge").textContent = t.network;
            document.getElementById("about-content").innerHTML = t.about;
            document.getElementById("lbl-type").textContent = t.lblType;
            document.getElementById("val-type").textContent = t.valType;
            document.getElementById("lbl-supply").textContent = t.lblSupply;
            document.getElementById("lbl-venue").textContent = t.lblVenue;
            document.getElementById("val-venue").textContent = t.valVenue;
            document.getElementById("lbl-holders").textContent = t.lblHolders;
            document.getElementById("checklist-content").innerHTML = t.checklist;
            document.getElementById("btn-gecko").textContent = t.btnGecko;
            document.getElementById("btn-solscan").textContent = t.btnSolscan;
            document.getElementById("btn-pump").textContent = t.btnPump;
            document.getElementById("lbl-ca").textContent = t.lblCa;
            document.getElementById("copy-btn-text").textContent = t.btnCopy;
            document.getElementById("risk-content").innerHTML = t.risk;
        }

        function copyTokenAddress() {
            const el = document.getElementById("ca-input");
            el.focus();
            el.select();
            const done = document.execCommand("copy");
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(el.value).then(function () {
                    alert(translations[currentLang].msgSuccess);
                }).catch(function () {
                    alert(done ? translations[currentLang].msgSuccess : translations[currentLang].msgFail);
                });
            } else {
                alert(done ? translations[currentLang].msgSuccess : translations[currentLang].msgFail);
            }
        }

        setLanguage("en");
    </script>
</body>
</html>
